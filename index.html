<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Reajuste</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculadora">

        <h1>Calculadora de Reajuste</h1>

        <label for="valorInicial">Valor inicial:</label>
        <input type="number" id="valorInicial" placeholder="Ex.: 3500">

        <label for="valorNovo">Novo valor:</label>
        <input type="number" id="valorNovo" placeholder="Ex.: 5900">

        <button onclick="calcularReajuste()">Calcular</button>

        <div class="resultado">

            <p>
                Diferença:
                <strong id="diferenca">R$ 0,00</strong>
            </p>

            <p>
                Percentual de reajuste:
                <strong id="percentual">0,00%</strong>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
